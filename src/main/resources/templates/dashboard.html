<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BOLA Defense System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #172033;
        }
        main {
            max-width: 780px;
        }
        form {
            margin: 24px 0;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
        }
        button {
            cursor: pointer;
        }
        .message {
            margin-top: 20px;
            font-weight: 700;
        }
        .resource {
            border: 1px solid #d8dee9;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
        }
        nav a {
            margin-right: 16px;
        }
    </style>
</head>
<body>
<main>
    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/logs">Audit logs</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Logout</button>
        </form>
    </nav>

    <h1>BOLA Defense System</h1>
    <p>Enter a resource ID. The server will enforce object-level authorization before returning it.</p>

    <form th:action="@{/resource/access}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="resourceId">Resource ID</label>
        <input type="number" id="resourceId" name="resourceId" min="1" required>
        <button type="submit">Access Resource</button>
    </form>

    <p class="message" th:if="${message}" th:text="${message}"></p>

    <section class="resource" th:if="${resource}">
        <h2 th:text="${resource.name()}">Resource name</h2>
        <p><strong>ID:</strong> <span th:text="${resource.id()}"></span></p>
        <p><strong>Owner:</strong> <span th:text="${resource.ownerId()}"></span></p>
        <p><strong>Department:</strong> <span th:text="${resource.department()}"></span></p>
        <p th:if="${resource.description()}" th:text="${resource.description()}"></p>
    </section>
</main>
</body>
</html>
